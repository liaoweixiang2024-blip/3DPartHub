name: Build & Push Docker Images

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.9.9)'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: 3DPartHub ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## 更新标题

            3DPartHub ${{ steps.version.outputs.version }} - 移动端细节、主题隔离与法务阅读体验优化版

            ## 标签描述

            3DPartHub ${{ steps.version.outputs.version }} production release with refined mobile model details, unified auth dialogs, legal document reading navigation, stronger theme isolation, optimized gallery thumbnails, and refreshed Docker images.

            ## 更新描述

            - 移动端模型详情页优化下载按钮与底部菜单距离，统一单行/双行标题骨架高度，减少抽屉加载和标题变化时的抖动。
            - 用户协议与隐私声明页面重新排版：日期并入阅读说明，PC 阅读目录支持自然吸顶，移动端目录改为侧边展开、独立滚动并避开底部菜单栏。
            - 登录/注册弹窗继续统一新旧主题移动端样式，注册弹窗底部用户协议与隐私声明留白更舒适。
            - 新旧主题隔离继续完善：主题模板、共享渲染器、登录注册弹窗、首页模型库和页面宽度细节持续收拢，避免主题样式互相污染。
            - 新主题首页模型库、侧边栏、页头、搜索框、排序筛选和模型列表间距继续优化，减少分类切换、搜索和排序时的抖动。
            - 产品图库缩略图策略继续加固：列表优先使用轻量缩略图，图片详情再加载大图，降低移动端浏览和瀑布流滚动卡顿。
            - 批量下载、收藏下载和下载文件命名继续修复，避免 STEP 压缩包混入多余 `.bin` 文件，并保留带斜杠型号的正确文件名。
            - 工单、询价和选型页面继续统一标题、输入框、快捷词、附件上传和移动端底部输入体验。
            - 后台系统设置的缓存、云存储、资源目录、版本检测和备份恢复相关交互继续完善。
            - 镜像已同步更新：api/web 均发布 ${{ steps.version.outputs.version }} 与 latest 标签。

            ## Docker Images

            API image title: `3dparthub-api:${{ steps.version.outputs.version }}`

            API image: `ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}`

            API image description: Express/Prisma API service with migrations, model conversion workers, backup/restore, audit logs, admin settings, queues, product gallery thumbnail processing, cache/storage checks, and background jobs.

            Web image title: `3dparthub-web:${{ steps.version.outputs.version }}`

            Web image: `ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}`

            Web image description: React/Vite frontend for 3D preview, theme-driven model library, mobile model details, product selection, product gallery browsing, inquiry/quote workflows, sharing, profile management, admin pages, legal pages, and unified auth dialogs.

            ```bash
            # Default deployment follows latest and uses Watchtower for api/web auto-updates.
            # Run this when you want to update immediately:
            cd /opt/3dparthub
            curl -L -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            touch .env
            grep -q '^IMAGE_TAG=' .env && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=latest/' .env || echo 'IMAGE_TAG=latest' >> .env
            docker compose pull
            docker compose up -d --force-recreate

            # Verify health
            curl http://localhost:3780/api/health
            ```

name: Build & Push Docker Images

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.9.6)'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: 3DPartHub ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## 更新标题

            3DPartHub ${{ steps.version.outputs.version }} - 批量下载、后台运维与移动端体验优化版

            ## 标签描述

            3DPartHub ${{ steps.version.outputs.version }} production release with unified batch-download archives, refreshed admin operation flows, smoother mobile navigation/share behavior, safer audit retention controls, and refreshed Docker images.

            ## 更新描述

            - 收藏、下载历史、分享管理的批量下载链路统一为 ZIP 打包下载，STEP 文件归档时不再混入多余 `.bin` 文件。
            - 下载历史、我的收藏、我的分享、工单、询价、用户管理、分享管理、下载统计和操作日志的批量操作、删除文案与刷新反馈统一。
            - 工单管理、询价管理、用户管理、分享管理、下载统计、操作日志补齐 tab、搜索、刷新、批量操作和统计展示体验。
            - 操作日志新增资源筛选、批量删除、导出和日志保留策略，后端补齐审计保留接口和清理服务。
            - 全站搜索框样式统一，焦点边框跟随后台主题配色；后台非必要图标 tooltip 已清理。
            - 产品图库图片加载与滚动性能优化，减少半图闪烁和下滑卡顿。
            - 移动端模型详情、我的分享、我的工单、选型分享和工单回复框布局稳定性增强，降低页头缺失、双页头和按钮错位概率。
            - 顶部加载条、选型页分享按钮、上传模型分类下拉、批量下载按钮等交互反馈优化，减少卡住、抖动和误判。
            - 后端下载、收藏、分享、工单、询价、审计和批量归档接口同步加固，并补充批量归档测试。
            - 镜像已同步更新：api/web 均发布 ${{ steps.version.outputs.version }} 与 latest 标签。

            ## Docker Images

            API image title: `3dparthub-api:${{ steps.version.outputs.version }}`

            API image: `ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}`

            API image description: Express/Prisma API service with migrations, model conversion workers, backup/restore, audit logs, admin settings, queues, and background jobs.

            Web image title: `3dparthub-web:${{ steps.version.outputs.version }}`

            Web image: `ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}`

            Web image description: React/Vite frontend for 3D preview, product selection, inquiry/quote workflows, sharing, profile management, admin pages, and smoother home browsing.

            ```bash
            # Default deployment follows latest and uses Watchtower for api/web auto-updates.
            # Run this when you want to update immediately:
            cd /opt/3dparthub
            curl -L -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            touch .env
            grep -q '^IMAGE_TAG=' .env && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=latest/' .env || echo 'IMAGE_TAG=latest' >> .env
            docker compose pull
            docker compose up -d --force-recreate

            # Verify health
            curl http://localhost:3780/api/health
            ```

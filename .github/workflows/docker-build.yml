name: Build & Push Docker Images

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.1.4)'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:latest
          labels: |
            org.opencontainers.image.title=3DPartHub API ${{ steps.version.outputs.version }}
            org.opencontainers.image.description=Express/Prisma API service with STEP temporary preview uploads, hardened modular backup/restore/import, protected downloads, secure Docker defaults, audit logs, rate-limited temporary files, admin settings, queues, cache/storage checks, and background jobs.
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:latest
          labels: |
            org.opencontainers.image.title=3DPartHub Web ${{ steps.version.outputs.version }}
            org.opencontainers.image.description=React/Vite frontend for 3D model libraries with temporary STEP viewer workspace, mobile/Safari download hardening, refined backup scope UI/statistics/health checks, product gallery, selection sharing, inquiry workflows, admin pages, and responsive mobile flows.
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: 3DPartHub ${{ steps.version.outputs.version }} - 临时看图与备份安全增强版
          generate_release_notes: true
          body: |
            ## 更新标题

            3DPartHub ${{ steps.version.outputs.version }} - 临时看图与备份安全增强版

            ## 标签描述

            3DPartHub ${{ steps.version.outputs.version }} production release with STEP temporary viewer, safer Safari/mobile downloads, complete modular backup restore coverage, hardened Docker secrets, accurate update version reporting, and refreshed Docker images.

            ## 更新描述

            - 新增临时看图页面，支持 STEP/STP 临时上传预览，不加入模型库、不生成产品记录。
            - 临时看图加入 50 MB 单文件限制、最多 5 条有效记录、上传限流、自动清理、删除同步清理源文件与预览文件。
            - 临时看图支持最近有效模型自动打开、拖拽上传、复制分享链接、移动端底部导航和贴近模型详情页的全屏预览布局。
            - 移除 XT/X_T 临时预览与转换入口，避免服务器缺少商业内核时误导用户。
            - 优化 Safari/PWA/移动端下载流程，避免下载模型时进入系统打开方式页面造成卡死。
            - 分模块备份补齐关联数据：模型收藏、下载、评论、分享链接，选型分享，产品图库收藏；`/thread-size` 规格数据随选型模块与整站备份。
            - 备份页显示真实资源统计，策略体检展示目录权限、磁盘空间、自动化、异地副本、加密和最近备份可用性。
            - 生产 Docker 部署强制配置 DB/Redis/JWT/Admin 初始密码，服务端拒绝生产弱密钥。
            - 检查更新版本识别改进，源码/本地部署不再显示 unknown，当前版本统一为 ${{ steps.version.outputs.version }}。
            - 批量归档上传保持中文文件名修复、ZIP/RAR 路径编码兼容与安全路径检查。
            - 发布前验证通过前后端类型检查、构建、核心单元测试、更新检测测试和页面路由抽检。
            - 镜像已同步更新：api/web 均发布 ${{ steps.version.outputs.version }} 与 latest 标签。

            ## Docker Images

            API image title: `3dparthub-api:${{ steps.version.outputs.version }}`

            API image: `ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}`

            API image description: Express/Prisma API service with STEP temporary preview uploads, hardened modular backup/restore/import, protected downloads, secure Docker defaults, audit logs, rate-limited temporary files, admin settings, queues, cache/storage checks, and background jobs.

            Web image title: `3dparthub-web:${{ steps.version.outputs.version }}`

            Web image: `ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}`

            Web image description: React/Vite frontend for 3D model libraries with temporary STEP viewer workspace, mobile/Safari download hardening, refined backup scope UI/statistics/health checks, product gallery, selection sharing, inquiry workflows, admin pages, and responsive mobile flows.

            ```bash
            # Default deployment follows latest and uses Watchtower for api/web auto-updates.
            # Run this when you want to update immediately:
            cd /opt/3dparthub
            curl -L -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            touch .env
            grep -q '^IMAGE_TAG=' .env && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=latest/' .env || echo 'IMAGE_TAG=latest' >> .env
            docker compose pull
            docker compose up -d --force-recreate

            # Verify health
            curl http://localhost:3780/api/health
            ```

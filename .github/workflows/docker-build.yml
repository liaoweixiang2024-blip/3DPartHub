name: Build & Push Docker Images

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.1.1)'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: 3DPartHub ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## 更新标题

            3DPartHub ${{ steps.version.outputs.version }} - 移动端分享预览与登录弹窗统一修复版

            ## 标签描述

            3DPartHub ${{ steps.version.outputs.version }} production release with unified auth dialogs across themes, corrected auth prompt routing, smoother mobile model/share previews, safer native sharing, and refreshed Docker images.

            ## 更新描述

            - 统一 PartHub 经典版与 PartHub 工作台的登录/注册弹窗外壳，注册表单在两个主题下保持一致。
            - 修复登录提示弹窗总开关与页面内下载、收藏、申请等登录动作的判断分流，关闭/开启逻辑更稳定。
            - 优化移动端模型详情和模型分享预览的底部下载区域、模型居中与安全区间距，减少抽屉与底部菜单割裂感。
            - 修复选型分享连续触发原生分享时的 InvalidStateError，增加分享中状态避免重复调用。
            - 优化系统设置标题菜单右对齐与保存状态宽度，减少保存后菜单轻微抖动。
            - 微调后台管理通用标题、表格和主题弹窗样式，让新旧主题交互保持一致。
            - 发布前验证通过前端类型检查、构建和格式检查。
            - 镜像已同步更新：api/web 均发布 ${{ steps.version.outputs.version }} 与 latest 标签。

            ## Docker Images

            API image title: `3dparthub-api:${{ steps.version.outputs.version }}`

            API image: `ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}`

            API image description: Express/Prisma API service with migrations, model conversion workers, upload/download hardening, X-Accel protected downloads, backup/restore safety checks, audit logs, admin settings, queues, cache/storage checks, and background jobs.

            Web image title: `3dparthub-web:${{ steps.version.outputs.version }}`

            Web image: `ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}`

            Web image description: React/Vite frontend for theme-driven model libraries, unified auth/register dialogs, mobile model/share previews, 3D viewing, product selection sharing, upload progress, batch downloads, product gallery browsing, inquiry/quote workflows, profile management, admin pages, legal pages, and responsive mobile flows.

            ```bash
            # Default deployment follows latest and uses Watchtower for api/web auto-updates.
            # Run this when you want to update immediately:
            cd /opt/3dparthub
            curl -L -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            touch .env
            grep -q '^IMAGE_TAG=' .env && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=latest/' .env || echo 'IMAGE_TAG=latest' >> .env
            docker compose pull
            docker compose up -d --force-recreate

            # Verify health
            curl http://localhost:3780/api/health
            ```

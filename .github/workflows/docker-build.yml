name: Build & Push Docker Images

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.1.3)'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:latest
          labels: |
            org.opencontainers.image.title=3DPartHub API ${{ steps.version.outputs.version }}
            org.opencontainers.image.description=3DPartHub API service with modular backup/restore/import, backup health checks, batch archive upload hardening, model conversion workers, protected downloads, audit logs, admin settings, queues, cache/storage checks, and background jobs.
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:latest
          labels: |
            org.opencontainers.image.title=3DPartHub Web ${{ steps.version.outputs.version }}
            org.opencontainers.image.description=React/Vite frontend for 3D model libraries with clearer backup scope selection, backup asset statistics, enterprise backup health guidance, update checks, batch downloads, product gallery, selection sharing, inquiry workflows, admin pages, and responsive mobile flows.
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: 3DPartHub ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## 更新标题

            3DPartHub ${{ steps.version.outputs.version }} - 备份与批量上传增强版

            ## 标签描述

            3DPartHub ${{ steps.version.outputs.version }} production release with modular backups, safer restore/import flows, clearer backup health checks, richer backup asset statistics, batch archive upload filename fixes, and refreshed Docker images.

            ## 更新描述

            - 新增整站、模型库、选型、产品图库四种备份范围，可按模块创建、导入和恢复备份。
            - 增强恢复安全：模块恢复前创建安全快照，恢复后保留表数据、资源目录和备份清单校验。
            - 修复并完善备份统计，展示数据库、模型原始文件、预览图、图纸、选型资源和产品图库资源的真实容量与数量。
            - 优化数据备份页：备份范围下拉框改为卡片式选择，企业级备份状态改为恢复点、自动化、异地副本、加密四项保障概览。
            - 策略体检新增备份加密检查，并在页面中给出可执行的处理建议。
            - 修复批量上传归档中的中文文件名乱码识别，兼容常见 ZIP/RAR 路径编码异常。
            - 修复批量上传空匹配归档时可能误解压整个归档的问题，并清理转换完成后的临时源文件。
            - 统一大文件导入阈值配置，避免前后端阈值不一致。
            - 发布前验证通过前后端类型检查、构建、备份单元测试和备份模块恢复端到端校验。
            - 镜像已同步更新：api/web 均发布 ${{ steps.version.outputs.version }} 与 latest 标签。

            ## Docker Images

            API image title: `3dparthub-api:${{ steps.version.outputs.version }}`

            API image: `ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}`

            API image description: Express/Prisma API service with modular backup/restore/import, backup health checks, batch archive upload hardening, model conversion workers, protected downloads, audit logs, admin settings, queues, cache/storage checks, and background jobs.

            Web image title: `3dparthub-web:${{ steps.version.outputs.version }}`

            Web image: `ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}`

            Web image description: React/Vite frontend for 3D model libraries with clearer backup scope selection, backup asset statistics, enterprise backup health guidance, update checks, batch downloads, product gallery, selection sharing, inquiry workflows, admin pages, and responsive mobile flows.

            ```bash
            # Default deployment follows latest and uses Watchtower for api/web auto-updates.
            # Run this when you want to update immediately:
            cd /opt/3dparthub
            curl -L -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            touch .env
            grep -q '^IMAGE_TAG=' .env && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=latest/' .env || echo 'IMAGE_TAG=latest' >> .env
            docker compose pull
            docker compose up -d --force-recreate

            # Verify health
            curl http://localhost:3780/api/health
            ```

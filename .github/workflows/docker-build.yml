name: Build & Push Docker Images

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.0.0)'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/3dparthub-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: 3DPartHub ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## 更新标题

            3DPartHub ${{ steps.version.outputs.version }} - 备份创建与生产镜像热修复版

            ## 标签描述

            3DPartHub ${{ steps.version.outputs.version }} production hotfix release with BusyBox tar compatible backup packaging, restored backup record creation, production-image verification, and refreshed Docker images.

            ## 更新描述

            - 修复生产 Docker 镜像中创建备份后没有生成 `.tar.gz` 和 `.json` 记录的问题。
            - 备份打包逻辑兼容 Alpine/BusyBox tar，不再因为多段 `-C` 参数导致 `_backup_db` 找不到。
            - 打包时使用单一归档根目录和目录软链接，避免为了兼容 tar 而复制整份模型静态目录，降低大站点备份时的磁盘压力。
            - 备份列表增加孤立 `.tar.gz` 兜底识别：即使元数据记录缺失，后台也能看到未登记备份，方便人工处理和恢复。
            - 已使用发布版 API 镜像 + 临时 PostgreSQL 环境复现并验证，修复后可正常生成备份包和后台记录。
            - 发布前验证通过服务端构建、类型检查、单元测试和生产镜像备份流程。
            - 镜像已同步更新：api/web 均发布 ${{ steps.version.outputs.version }} 与 latest 标签。

            ## Docker Images

            API image title: `3dparthub-api:${{ steps.version.outputs.version }}`

            API image: `ghcr.io/${{ github.repository_owner }}/3dparthub-api:${{ steps.version.outputs.version }}`

            API image description: Express/Prisma API service with migrations, model conversion workers, upload/download hardening, X-Accel protected downloads, BusyBox-compatible backup creation, backup/restore safety checks, audit logs, admin settings, queues, cache/storage checks, and background jobs.

            Web image title: `3dparthub-web:${{ steps.version.outputs.version }}`

            Web image: `ghcr.io/${{ github.repository_owner }}/3dparthub-web:${{ steps.version.outputs.version }}`

            Web image description: React/Vite frontend for 3D preview, theme-driven model library, model upload progress, batch download feedback, product selection, product gallery browsing, inquiry/quote workflows, sharing, profile management, admin pages, legal pages, and unified auth dialogs.

            ```bash
            # Default deployment follows latest and uses Watchtower for api/web auto-updates.
            # Run this when you want to update immediately:
            cd /opt/3dparthub
            curl -L -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            touch .env
            grep -q '^IMAGE_TAG=' .env && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=latest/' .env || echo 'IMAGE_TAG=latest' >> .env
            docker compose pull
            docker compose up -d --force-recreate

            # Verify health
            curl http://localhost:3780/api/health
            ```

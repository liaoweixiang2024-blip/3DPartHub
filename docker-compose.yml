# ============================================================
# 3DPartHub — 纯镜像一键部署配置
# ============================================================
#
# 【快速开始】
#   curl -fsSL https://raw.githubusercontent.com/liaoweixiang2024-blip/3DPartHub/main/install.sh | bash
#   登录账号: 邮箱（即 .env 的 ADMIN_EMAIL，部署脚本会打印实际值）；初始密码为部署时随机生成、写在同目录 .env 的 ADMIN_PASS，首次登录会强制修改密码
#
# 【更安全的方式】
#   如需自定义密码，在同目录创建 .env：
#   DB_PASSWORD="$(openssl rand -hex 24)"
#   REDIS_PASSWORD="$(openssl rand -hex 24)"
#   JWT_SECRET="$(openssl rand -hex 32)"
#   BACKUP_SIGNING_SECRET="$(openssl rand -hex 32)"
#   BACKUP_ENCRYPTION_SECRET="$(openssl rand -hex 32)"
#   ADMIN_PASS="$(openssl rand -base64 24)"
#   cat > .env <<EOF
#   DB_PASSWORD=${DB_PASSWORD}
#   REDIS_PASSWORD=${REDIS_PASSWORD}
#   JWT_SECRET=${JWT_SECRET}
#   BACKUP_SIGNING_SECRET=${BACKUP_SIGNING_SECRET}
#   BACKUP_ENCRYPTION_SECRET=${BACKUP_ENCRYPTION_SECRET}
#   ADMIN_PASS=${ADMIN_PASS}
#   EOF
#   docker compose up -d
#   访问 http://服务器IP:3780
#
# 【更新】
#   默认使用 latest 镜像
#   手动更新: docker compose pull && docker compose up -d --force-recreate
#   如需锁定版本: 在 .env 中写入 IMAGE_TAG=v3.2.3
#   检查日志: docker compose logs -f api
#
# 【数据安全】
#   所有数据存储在 Docker 命名卷中，升级/重建容器不会丢失：
#     pgdata       — PostgreSQL 数据库
#     uploads-data — 上传的原始模型文件
#     static-data  — 转换后的模型、缩略图等运行文件
#   备份包单独映射到宿主机目录，方便人工拷贝和迁移：
#     ./server/static/backups -> /app/static/backups
#   api 启动时会自动修复该目录权限
#
# 【备份恢复】
#   网页创建的备份存储在宿主机 ./server/static/backups，重启/升级不丢失
#   从外部导入备份: cp backup_xxx.json ./server/static/backups/
#                   cp backup_xxx.tar.gz ./server/static/backups/
#   然后网页端「设置 → 数据备份」恢复
#
# 【迁移到新服务器】
#   1. 旧服务器：设置 → 数据备份 → 创建备份
#   2. 备份文件位于宿主机 ./server/static/backups，可直接复制：
#      scp ./server/static/backups/backup_xxx.* 新服务器:/tmp/backups/
#   3. 新服务器部署后导入：
#      cp /tmp/backups/backup_xxx.* ./server/static/backups/
#   4. 网页端恢复
#
#   ⚠ 重要：备份带 HMAC 签名（用 BACKUP_SIGNING_SECRET，未设则用 JWT_SECRET）。
#      新服务器若是全新部署，这几个密钥会是新生成的随机值，与旧服务器不同，
#      列表式恢复会报「备份签名校验失败」。三选一解决：
#      ① 把旧服务器的 BACKUP_SIGNING_SECRET（以及若启用过加密的 BACKUP_ENCRYPTION_SECRET）
#        原样复制到新服务器的 .env，重启 api 后再恢复；
#      ② 恢复确认对话框里勾选「跨服务器迁移：跳过签名校验」（仍校验文件完整性）；
#      ③ 改用「导入恢复」直接上传单个 .tar.gz（只校验文件完整性、不校验签名）。
#      备份数据本身完全自包含（数据库 + 文件），不含主机名/绝对路径，跨服务器可放心迁移。
#
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '5'

# <<< 默认使用 latest；手动立即更新执行 docker compose pull && docker compose up -d --force-recreate

services:
  api:
    image: ghcr.io/liaoweixiang2024-blip/3dparthub-api:${IMAGE_TAG:-latest}
    container_name: 3dparthub-api
    init: true
    # Safe fallback for bare docker compose. deploy.sh and scripts/tune-resources.sh
    # automatically write an appropriate .env profile for the actual server memory.
    shm_size: ${API_SHM_SIZE:-256M}
    mem_limit: ${API_MEMORY_LIMIT:-900M}
    mem_reservation: ${API_MEMORY_RESERVATION:-256M}
    cpus: '${API_CPU_LIMIT:-1.2}'
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-900M}
          cpus: '${API_CPU_LIMIT:-1.2}'
        reservations:
          memory: ${API_MEMORY_RESERVATION:-256M}
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: 'postgresql://modeluser:${DB_PASSWORD:-3dparthub-default-db-password-change-me-2026}@postgres:5432/3dparthub?connection_limit=${DB_CONNECTION_LIMIT:-3}&pool_timeout=10'
      # <<< 必须在 .env 中设置为随机字符串 (openssl rand -hex 32)，未设置则拒绝启动
      JWT_SECRET: '${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（建议 openssl rand -hex 32）}'
      BACKUP_SIGNING_SECRET: '${BACKUP_SIGNING_SECRET:-}'
      BACKUP_ENCRYPTION_SECRET: '${BACKUP_ENCRYPTION_SECRET:-}'
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: uploads
      STATIC_DIR: static
      API_WORKERS: ${API_WORKERS:-1}
      CONVERSION_WORKER_CONCURRENCY: ${CONVERSION_WORKER_CONCURRENCY:-1}
      SLOW_REQUEST_LOG_BURST: ${SLOW_REQUEST_LOG_BURST:-5}
      SLOW_REQUEST_LOG_SAMPLE_RATE: ${SLOW_REQUEST_LOG_SAMPLE_RATE:-0.01}
      MAX_FILE_SIZE: 524288000
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@model.local}
      ADMIN_PASS: '${ADMIN_PASS:?请在 .env 中设置 ADMIN_PASS}'
      # <<< 可选: 允许的来源域名 (多个用逗号分隔，留空则仅同源)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-models}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # <<< 可选: 邮件通知 (注册验证码)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # <<< 可选: 启动时自动同步分类数据 (设为 0 禁用)
      AUTO_SEED: ${AUTO_SEED:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
      - static-data:/app/static
      - ./server/static/backups:/app/static/backups
      # 修复预览引擎（可选）：宿主机安装 gmsh 后挂载进容器
      # （alpine 镜像无 gmsh 包；宿主执行：apt install -y gmsh 或 brew install gmsh）
      # - /usr/bin/gmsh:/usr/local/host-bin/gmsh:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8000/api/health/ready >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 5m
    logging: *default-logging
    networks:
      - internal

  web:
    image: ghcr.io/liaoweixiang2024-blip/3dparthub-web:${IMAGE_TAG:-latest}
    container_name: 3dparthub-web
    init: true
    mem_limit: ${WEB_MEMORY_LIMIT:-128M}
    cpus: '${WEB_CPU_LIMIT:-0.3}'
    ports:
      - '${PORT:-3780}:80'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-128M}
          cpus: '${WEB_CPU_LIMIT:-0.3}'
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - static-data:/app/static:ro
      - uploads-data:/app/uploads:ro
      # 备份包必须与 api 共用同一 bind mount：备份下载走 nginx X-Accel-Redirect
      # （/_protected_static/ alias /app/static/），若只挂命名卷 nginx 看不到
      # ./server/static/backups 里的备份文件，下载会 404「未发现文件」
      - ./server/static/backups:/app/static/backups:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: 3dparthub-postgres
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-384M}
    cpus: '${POSTGRES_CPU_LIMIT:-0.7}'
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-384M}
          cpus: '${POSTGRES_CPU_LIMIT:-0.7}'
    environment:
      POSTGRES_DB: 3dparthub
      POSTGRES_USER: modeluser
      # <<< 必须在 .env 中设置强密码，与 API 的 DB_PASSWORD 一致
      POSTGRES_PASSWORD: '${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U modeluser -d 3dparthub']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: 3dparthub-redis
    # 容器内存上限必须 > REDIS_MAXMEMORY：Redis 做数据缓存 + AOF 重写/BGSAVE fork
    # 还要额外内存（COW 瞬时可达数据量 ~2 倍）。经验值：mem_limit ≈ 2 × maxmemory。
    # 若在 .env 里调高 REDIS_MAXMEMORY，务必同步把 REDIS_MEMORY_LIMIT 调到 ≥ 2 倍，
    # 否则数据涨上来后容器会先于 maxmemory 触发被系统 OOM-kill。
    mem_limit: ${REDIS_MEMORY_LIMIT:-256M}
    cpus: '${REDIS_CPU_LIMIT:-0.3}'
    command:
      - redis-server
      - --requirepass
      - '${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}'
      - --save
      - ''
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      # volatile-lru：内存吃紧时只淘汰带 TTL 的缓存 key（categories/settings/models 等），
      # 保留 BullMQ 任务 key（多数无 TTL，绝不能被淘汰，否则队列会丢任务）。
      # 比 noeviction 安全：noeviction 满了会直接写失败并把整个缓存层关掉。
      - --maxmemory-policy
      - volatile-lru
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256M}
          cpus: '${REDIS_CPU_LIMIT:-0.3}'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'sh', '-c', 'REDISCLI_AUTH=${REDIS_PASSWORD:-changeme-set-in-env} redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

# 数据卷显式命名（固定为生产前缀 3dparthub_）：compose 默认用「目录名_卷名」，
# 一旦部署目录改名/换位置（如 /opt/3dparthub → 别的目录）启动，会静默连上一套
# 全新的空卷，造成"数据全部丢失"的假象。显式命名后无论在哪个目录启动都接同一组卷。
volumes:
  pgdata:
    name: 3dparthub_pgdata
  uploads-data:
    name: 3dparthub_uploads-data
  static-data:
    name: 3dparthub_static-data
  redis-data:
    name: 3dparthub_redis-data

networks:
  internal:

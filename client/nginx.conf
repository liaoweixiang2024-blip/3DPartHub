upstream api_backend {
    server api:8000;
    keepalive 256;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend upload policy is the source of truth; nginx only avoids rejecting valid configured uploads early.
    client_max_body_size 100g;

    # Connection optimizations
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_timeout 120s;
    client_header_timeout 30s;
    send_timeout 120s;
    reset_timedout_connection on;
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;

    # Hide nginx version
    server_tokens off;

    # Security headers (inherited by locations without their own add_header)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_buffers 16 8k;

    # Open file cache for static assets
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;

    # API proxy — never cache dynamic API responses
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Available "1";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering on;
        proxy_buffers 8 16k;

        # Force browsers/CDNs to never cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 外层代理（宝塔等独立反代）默认 proxy_buffering 会把大文件/流式响应缓冲到
        # 本地盘，曾把下载掐流。响应头 X-Accel-Buffering: no 是 nginx 标准信号：
        # 任何 nginx 外层收到它都会对该响应自动关缓冲——外层保持零特殊配置。
        add_header X-Accel-Buffering "no" always;
    }

    # Container health check endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # PWA manifest — generated by the API from admin site settings so the
    # "Install app" prompt shows the configured app name. Falls back to the
    # static build-time manifest when the backend is down.
    location = /site.webmanifest {
        proxy_pass http://api_backend/api/settings/site-manifest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        error_page 502 503 504 = @manifest_fallback;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @manifest_fallback {
        root /usr/share/nginx/html;
        try_files /site.webmanifest =404;
    }

    # Direct model upload — needs long timeout for large files and conversion queueing
    location /api/models/upload {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Available "1";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
        proxy_buffering off;
        # The application enforces actual upload limits from system settings.
        client_max_body_size 100g;
    }

    # Batch upload — large archives need long timeout and body allowance.
    location /api/batch/upload {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Available "1";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 100g;
    }

    # Chunked upload — needs long timeout for merge and large chunk transfer
    location /api/upload/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Available "1";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
        proxy_buffering off;
        # The application enforces actual upload limits from system settings.
        client_max_body_size 100g;
    }

    # Backup import/export - longer timeouts
    location /api/settings/backup/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Available "1";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 100g;
    }

    # Authenticated downloads: API validates first, then nginx serves the file.
    # ^~ is load-bearing: X-Accel-Redirect re-runs location matching on the internal
    # URI, and plain prefix locations LOSE to any matching regex below — a regex
    # matching e.g. /_protected_static/models/x.glb once hijacked the internal
    # redirect into try_files against the web root and broke every accelerated
    # .glb/.png download with a bare nginx 404 (v5.4.6 regression).
    location ^~ /_protected_static/ {
        internal;
        alias /app/static/;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        aio threads;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=300" always;
        # 见 /api/ 处注释：让外层代理对加速下载响应自动关缓冲
        add_header X-Accel-Buffering "no" always;
    }

    location ^~ /_protected_uploads/ {
        internal;
        alias /app/uploads/;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        aio threads;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Accel-Buffering "no" always;
    }

    # Never expose sensitive static subdirectories directly.
    location ~ ^/static/(backups|_backup_db|_safety_snapshots|html-previews|originals|ticket-attachments|inquiry-attachments|drawings|batch|\.restore_[^/]*)(/|$) {
        return 404;
    }

    # Converted model assets may be gated by backend settings; route through API instead of nginx alias.
    location /static/models/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Available "1";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        # 见 /api/ 处注释：模型 glb 直连路径，让外层代理自动关缓冲
        add_header X-Accel-Buffering "no" always;
    }

    # Admin-configurable brand assets (favicon/, logo/, watermark/) use FIXED
    # filenames — a re-upload replaces the file at the same URL. "immutable"
    # on them would pin a stale icon for 30 days (desktop PWA install icons
    # read the manifest src without a cache-buster). Serve with must-revalidate
    # so browsers revalidate on next use.
    # NOTE: placed before the generic /static/ block — nginx picks the FIRST
    # matching regex location, prefix locations are checked after regexs.
    # FIX: regex location 里 try_files $uri 会带上完整 /static/ 前缀，与 alias
    # 拼出 /app/static/static/... 双重路径（前缀 location 无此问题，正则 location 的
    # alias 不做前缀替换）。用捕获组显式映射（favicon/logo/watermark 一直 404 的根因）。
    location ~* ^/static/(favicon|logo|watermark)/(.+)$ {
        alias /app/static/;
        try_files /$1/$2 =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Root-level static files (build public/: occt-import-js.js/.wasm, fonts/,
    # icons.svg, theme preview svgs) have FIXED filenames — no content hash.
    # Without an explicit Cache-Control, browsers fall back to heuristic
    # freshness (10% of Last-Modified age) and iOS home-screen webapps (which
    # keep a disk cache separate from Safari) keep serving the stale copy after
    # a deploy — the "half old code after an update" bug. must-revalidate keeps
    # them fresh (304 round-trips are cheap). Hashed /assets/ and backend
    # /static/ keep their immutable policy — excluded via negative lookahead.
    # Declared BEFORE the font block below so root-level fonts (fixed names)
    # revalidate too, while /assets/ & /static/ fonts still fall through to it.
    # _protected_* MUST stay excluded (plus the ^~ on those locations): these are
    # X-Accel-Redirect internal URIs whose files live in the api-shared volume,
    # NOT the web root — matching here would 404 every accelerated download.
    location ~* ^/(?!assets/|static/|api/|uploads/|_protected_)(?:[^/]+/)*[^/]+\.(js|mjs|wasm|css|json|png|jpe?g|gif|svg|ico|webmanifest|txt|bin|glb|hdr|ktx2|woff2?|ttf|otf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SVG can carry active content when opened directly; sandbox it even for public option images/logos.
    location ~* ^/static/(.+\.svg)$ {
        alias /app/static/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox" always;
    }

    # Public static files (converted previews, thumbnails, option images).
    location /static/ {
        alias /app/static/;
        try_files $uri =404;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        aio threads;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # 见 /api/ 处注释：缩略图/图纸等静态文件，让外层代理自动关缓冲
        add_header X-Accel-Buffering "no" always;
    }

    # Uploads are served only through authenticated X-Accel redirects.
    location /uploads/ {
        return 404;
    }

    # Maintenance page — served when backend is down (502/503)
    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
    }

    # Internal target for the index.html SSI head injection. Subrequests that
    # hit this location get an overridden error_page: without this override the
    # server-level `error_page 502 503 /maintenance.html` would intercept the
    # subrequest failure and splice the whole maintenance page INSIDE <head>,
    # breaking the document. With the override, a failed subrequest simply
    # makes SSI drop the directive — index.html then serves its build-time
    # default title as the fallback.
    location = /api/settings/head-fragment {
        internal;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSI does not decompress subresponses — never advertise gzip acceptance,
        # so the API's compression middleware returns plain text.
        proxy_set_header Accept-Encoding "identity";
        # Intercept ALL error statuses, not just backend-down (502-504): e.g. the
        # API's anti-proxy guard returns 403 with a full HTML warning page, which
        # would otherwise get spliced into <head> and render as garbage at the top
        # of the page until React takes over. Any failure falls back to the
        # build-time default head fragment.
        proxy_intercept_errors on;
        error_page 403 404 429 500 502 503 504 =200 /head-fragment-fallback;
    }

    # Build-time default head fragment (kept in the image next to index.html)
    location = /head-fragment-fallback {
        internal;
        root /usr/share/nginx/html;
        try_files /head-fragment-default.html =404;
        error_page 404 =200 /head-fragment-empty;
    }

    location = /head-fragment-empty {
        internal;
        default_type text/html;
        return 200 '<title>3DPartHub</title>';
    }

    # Custom error pages for backend downtime.
    # NOTE: the SSI head-fragment location overrides this with an empty/fallback
    # error_page — see the comment above location = /api/settings/head-fragment.
    error_page 502 503 /maintenance.html;

    # SPA fallback — never cache index.html so new bundles are always discovered.
    # SSI on: index.html contains <!--# include virtual="/api/settings/head-fragment" -->
    # which nginx replaces server-side with the admin-configured <title>/<meta> so the
    # first paint (before any JS runs) already shows the correct brand. Every SPA route
    # internally redirects here via try_files, so all pages get the injection.
    location = /index.html {
        ssi on;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;
    }

    # Service worker — must never be cached long, or new versions won't reach
    # clients and PWA installs would be stuck on an old shell. Served from the
    # build root (public/sw.js -> dist/sw.js).
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Build version probe (emitted by vite at build time). UpdateBanner polls it
    # to detect a newly deployed bundle — most critical for iOS home-screen
    # webapps, which resume a suspended DOM on launch and never re-navigate.
    # Must never be cached, or resumed clients keep seeing the old version.
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets (JS/CSS bundles with hash) — serve pre-compressed
    location /assets/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        gzip_static on;
    }

    # Font files
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 180d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

<!doctype html>
<html class="dark" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 图标声明（favicon / apple-touch-icon）全部由下方 SSI 片段输出，
         不在此静态声明——否则构建期 PNG 会压过后台设置的自定义 favicon -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--# include virtual="/api/settings/head-fragment" -->
    <meta name="theme-color" content="#faf9f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="/fonts/space-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <script>
      // Apply site config from localStorage before React hydrates to prevent flash
      (function () {
        try {
          var raw = localStorage.getItem('site_config_cache');
          if (!raw) return;
          var stored = JSON.parse(raw);
          var cfg = stored && stored.data;
          if (!cfg) return;
          var title = cfg.site_browser_title || cfg.site_title;
          if (title) {
            document.title = title;
            var ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute('content', title);
          }
          var desc = cfg.site_description;
          if (desc) {
            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute('content', desc);
            var ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.setAttribute('content', desc);
          }
          if (cfg.site_favicon) {
            var link = document.querySelector('link[rel="icon"]');
            // SSI 已注入后台配置的 favicon（生产）：路径一致就不要改写 href——
            // 加载后变更 favicon 链接会触发 Chrome「首次打开不显示、刷新才出现」
            if (link && (link.getAttribute('href') || '').split('?')[0] !== cfg.site_favicon) {
              link.href = cfg.site_favicon;
            }
          }
          var themeRaw = localStorage.getItem('theme-storage');
          var themeState = themeRaw && JSON.parse(themeRaw).state;
          var isLight = !themeState || themeState.theme !== 'dark';
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', isLight ? '#faf9f7' : '#121316');
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusBar) statusBar.setAttribute('content', isLight ? 'default' : 'black-translucent');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
